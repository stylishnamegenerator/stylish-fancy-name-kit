<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fancy-name-kit demo – Unicode fancy fonts & name limit checker</title>
<meta name="description" content="Open-source demo: convert text to Unicode fancy fonts and check it against game and app name limits.">
<style>
  :root{--bg:#0b1120;--card:#121a2e;--line:#26324d;--text:#eef2f8;--muted:#9fb0c6;--teal:#4fb8a8}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  main{max-width:720px;margin:0 auto;padding:32px 16px 48px}
  h1{font-size:28px;margin:0 0 4px}
  p.lead{color:var(--muted);margin:0 0 24px}
  .row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
  input,select{flex:1;min-width:200px;background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:12px;padding:14px;font-size:18px}
  select{font-size:16px;flex:0 0 auto}
  .limit{font-size:14px;color:var(--muted);margin-bottom:20px}
  .ok{color:#5fd39a}.bad{color:#ff7b7b}
  ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
  li{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .txt{font-size:20px;word-break:break-all}
  .meta{font-size:12px;color:var(--muted)}
  button{background:var(--teal);color:#0b1120;border:0;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer;white-space:nowrap}
  footer{margin-top:32px;font-size:14px;color:var(--muted)}
  a{color:var(--teal)}
</style>
</head>
<body>
<main>
  <h1>fancy-name-kit</h1>
  <p class="lead">Convert text to Unicode “fancy font” styles and check whether the result fits a game or app name limit. Everything runs in your browser.</p>
  <div class="row">
    <input id="in" value="Hammad" aria-label="Your name" maxlength="60">
    <select id="pf" aria-label="Platform"></select>
  </div>
  <div class="limit" id="lim"></div>
  <ul id="out"></ul>
  <footer>
    Open source (MIT) on <a href="https://github.com/stylishnamegenerator/stylish-fancy-name-kit">GitHub</a>.
    Want hundreds of styles, symbols and frames? Try the full
    <a href="https://stylishnamegenerators.com/">Stylish Name Generator</a>.
  </footer>
</main>
<script src="fancy-name-kit.js"></script>
<script>
  var K = FancyNameKit, inp = document.getElementById('in'), pf = document.getElementById('pf'),
      out = document.getElementById('out'), lim = document.getElementById('lim');
  var labels = {freeFire:'Free Fire (12)',pubgMobile:'PUBG Mobile (14)',whatsappName:'WhatsApp name (25)',instagramName:'Instagram name (30)',
                tiktokName:'TikTok name (30)',discordDisplayName:'Discord display name (32)',xDisplayName:'X display name (50)',robloxDisplayName:'Roblox display name (20)'};
  Object.keys(K.LIMITS).forEach(function(k){ var o=document.createElement('option'); o.value=k; o.textContent=labels[k]||k; pf.appendChild(o); });
  function render(){
    var v = inp.value || 'Your name';
    out.innerHTML = '';
    K.convertAll(v).forEach(function(r){
      var c = K.checkLimit(r.text, pf.value);
      var li = document.createElement('li');
      li.innerHTML = '<div><div class="txt"></div><div class="meta"></div></div><button type="button">Copy</button>';
      li.querySelector('.txt').textContent = r.text;
      li.querySelector('.meta').innerHTML = r.style + ' · ' + c.visible + ' visible / ' + c.codeUnits + ' code units · ' +
        (c.fitsStrict ? '<span class="ok">fits</span>' : c.fitsVisible ? '<span class="bad">may not fit</span>' : '<span class="bad">too long</span>');
      li.querySelector('button').onclick = function(e){ navigator.clipboard.writeText(r.text); e.target.textContent='Copied'; setTimeout(function(){e.target.textContent='Copy'},1200); };
      out.appendChild(li);
    });
    lim.textContent = 'Fancy letters often count as 2 characters in apps and games, so “may not fit” means: test it before you save. Limits change — always check in the app.';
  }
  inp.oninput = pf.onchange = render; render();
</script>
</body>
</html>
